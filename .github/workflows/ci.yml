name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de sistema para GUI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy openpyxl python-dotenv pillow

      - name: Testes (pytest)
        run: pytest tests/test_config.py tests/test_data.py -v --tb=short
